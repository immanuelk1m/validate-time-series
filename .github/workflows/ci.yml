name: Validation checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install evaluation dependencies
        run: python -m pip install -r skills/validate-time-series/scripts/requirements.txt
      - name: Evaluation regression checks
        run: python skills/validate-time-series/scripts/test_validation.py
      - name: Repository and publication guard checks
        run: python tools/test_repository.py
      - name: Synthetic end-to-end smoke test
        run: python skills/validate-time-series/scripts/demo.py --out "$RUNNER_TEMP/ts-validation-smoke"
